# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Envio HyperIndex for Mawee on Monad. `pnpm deploy:testnet` (contracts/)
# rewrites the addresses and start_block below after each deployment.
name: mawee-indexer
# Lowercase addresses so the app can match owners/recipients with plain
# string equality.
address_format: lowercase
field_selection:
  transaction_fields:
    - hash
chains:
  - id: 10143
    start_block: 0
    contracts:
      - name: Pool
        address:
          - "0xfdfcb53eeb148709510bbd4e7d164065605baea5"
          - "0x8b0015711517e2b2b7cdd430e11bc2a0e9cca092"
          - "0x166bf3e602e10a71a59b4a57aeb842fd12d71d9d"
          - "0x8df03a1b169dda861d633035b945a484bcf234ca"
          - "0x7539d7585dbd7b49f23d23549d65cc995346838b"
          - "0xe19fc79a122a8314d43ac543bd72d27e6bf0d838"
        events:
          - event: Deposit(uint32 indexed leafIndex, bytes32 commitment, bytes32 ephemeralPk, bytes ciphertext)
          - event: Spend(bytes32 indexed nullifier)
          - event: Withdrawal(bytes32 indexed nullifier, address indexed recipient, uint256 amount)
          - event: PausedSet(bool paused)
      - name: Registry
        address:
          - "0xa3024964732bf324256c3dbb3be314e254cb6a70"
        events:
          - event: Registered(bytes32 indexed usernameHash, string username, address indexed owner, bytes32 notePubkey, bytes32 viewPubkey)
          - event: PubkeysRotated(bytes32 indexed usernameHash, address indexed owner, bytes32 notePubkey, bytes32 viewPubkey)
