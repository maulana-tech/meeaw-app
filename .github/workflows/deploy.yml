name: Deploy web to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mawee-web

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_MONAD_CHAIN_ID=${{ vars.NEXT_PUBLIC_MONAD_CHAIN_ID }}
            NEXT_PUBLIC_MONAD_RPC_URL=${{ vars.NEXT_PUBLIC_MONAD_RPC_URL }}
            NEXT_PUBLIC_MAWEE_REGISTRY_ADDRESS=${{ vars.NEXT_PUBLIC_MAWEE_REGISTRY_ADDRESS }}
            NEXT_PUBLIC_MAWEE_POOL_ADDRESS=${{ vars.NEXT_PUBLIC_MAWEE_POOL_ADDRESS }}
            NEXT_PUBLIC_MAWEE_POOL_DEPLOY_BLOCK=${{ vars.NEXT_PUBLIC_MAWEE_POOL_DEPLOY_BLOCK }}
            NEXT_PUBLIC_USDC_ADDRESS=${{ vars.NEXT_PUBLIC_USDC_ADDRESS }}
            NEXT_PUBLIC_USDC_DECIMALS=${{ vars.NEXT_PUBLIC_USDC_DECIMALS }}
            NEXT_PUBLIC_USDC_MINTABLE=${{ vars.NEXT_PUBLIC_USDC_MINTABLE }}
            NEXT_PUBLIC_POOL_DEPTH=${{ vars.NEXT_PUBLIC_POOL_DEPTH }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SSH_USER }}/mawee
          overwrite: true

      - name: Pull and restart on the box
        uses: appleboy/ssh-action@v1
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: MONGODB_URI,CRON_SECRET,PRIVY_APP_ID,PRIVY_APP_SECRET,RELAYER_PRIVATE_KEY
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SSH_USER }}/mawee
            umask 077
            test -n "${MONGODB_URI}"
            test -n "${CRON_SECRET}"
            test -n "${PRIVY_APP_ID}"
            test -n "${PRIVY_APP_SECRET}"
            secret_env="$(mktemp)"
            grep -Ev '^(MONGODB_URI|CRON_SECRET|PRIVY_APP_ID|PRIVY_APP_SECRET|RELAYER_PRIVATE_KEY)=' .env.production > "${secret_env}" || true
            {
              printf '%s\n' "MONGODB_URI=${MONGODB_URI}"
              printf '%s\n' "CRON_SECRET=${CRON_SECRET}"
              printf '%s\n' "PRIVY_APP_ID=${PRIVY_APP_ID}"
              printf '%s\n' "PRIVY_APP_SECRET=${PRIVY_APP_SECRET}"
              printf '%s\n' "RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}"
            } >> "${secret_env}"
            mv "${secret_env}" .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export MAWEE_IMAGE="${{ needs.build-and-push.outputs.image }}"
            grep -q '^MAWEE_IMAGE=' .env && sed -i "s#^MAWEE_IMAGE=.*#MAWEE_IMAGE=${MAWEE_IMAGE}#" .env || echo "MAWEE_IMAGE=${MAWEE_IMAGE}" >> .env
            docker compose pull web pool-indexer migrate
            if ! docker compose up -d; then
              docker compose logs --no-color migrate || true
              exit 1
            fi
            docker compose logs --no-color migrate
            docker image prune -f
