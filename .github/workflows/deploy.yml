name: Deploy web to Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/olio-web

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_STELLAR_NETWORK=${{ vars.NEXT_PUBLIC_STELLAR_NETWORK }}
            NEXT_PUBLIC_STELLAR_RPC_URL=${{ vars.NEXT_PUBLIC_STELLAR_RPC_URL }}
            NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_OLIO_REGISTRY_ID=${{ vars.NEXT_PUBLIC_OLIO_REGISTRY_ID }}
            NEXT_PUBLIC_OLIO_POOL_ID=${{ vars.NEXT_PUBLIC_OLIO_POOL_ID }}
            NEXT_PUBLIC_USDC_SAC_ID=${{ vars.NEXT_PUBLIC_USDC_SAC_ID }}
            NEXT_PUBLIC_USDC_ISSUER=${{ vars.NEXT_PUBLIC_USDC_ISSUER }}
            NEXT_PUBLIC_POOL_DEPTH=${{ vars.NEXT_PUBLIC_POOL_DEPTH }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_CHANNELS_ENABLED=${{ vars.NEXT_PUBLIC_CHANNELS_ENABLED }}
            NEXT_PUBLIC_SEP24_ANCHOR_URL=${{ vars.NEXT_PUBLIC_SEP24_ANCHOR_URL }}
            NEXT_PUBLIC_SEP24_ASSET_CODE=${{ vars.NEXT_PUBLIC_SEP24_ASSET_CODE }}
            NEXT_PUBLIC_SEP10_CLIENT_DOMAIN=${{ vars.NEXT_PUBLIC_SEP10_CLIENT_DOMAIN }}
            NEXT_PUBLIC_MONEYGRAM_RAMP_STATUS=${{ vars.NEXT_PUBLIC_MONEYGRAM_RAMP_STATUS }}
            NEXT_PUBLIC_STELLAR_HORIZON_URL=${{ vars.NEXT_PUBLIC_STELLAR_HORIZON_URL }}
            NEXT_PUBLIC_FRIENDBOT_URL=${{ vars.NEXT_PUBLIC_FRIENDBOT_URL }}
            NEXT_PUBLIC_CCTP_INTAKE_CONTRACT=${{ vars.NEXT_PUBLIC_CCTP_INTAKE_CONTRACT }}
            NEXT_PUBLIC_CCTP_TOKEN_MESSENGER_MINTER=${{ vars.NEXT_PUBLIC_CCTP_TOKEN_MESSENGER_MINTER }}
            NEXT_PUBLIC_CCTP_MESSAGE_TRANSMITTER=${{ vars.NEXT_PUBLIC_CCTP_MESSAGE_TRANSMITTER }}
            NEXT_PUBLIC_CCTP_FORWARDER=${{ vars.NEXT_PUBLIC_CCTP_FORWARDER }}
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
            NEXT_PUBLIC_SOLANA_USDC_MINT=${{ vars.NEXT_PUBLIC_SOLANA_USDC_MINT }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SSH_USER }}/olio
          overwrite: true

      - name: Pull and restart on the box
        uses: appleboy/ssh-action@v1
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEP10_CLIENT_SIGNING_SECRET: ${{ secrets.SEP10_CLIENT_SIGNING_SECRET }}
          PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          OLIO_WALLET_DEPLOYER_SECRET: ${{ secrets.OLIO_WALLET_DEPLOYER_SECRET }}
          OLIO_ACCOUNT_WASM_HASH: ${{ secrets.OLIO_ACCOUNT_WASM_HASH }}
          BRIDGE_SPONSOR_SECRET: ${{ secrets.BRIDGE_SPONSOR_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: MONGODB_URI,CRON_SECRET,SEP10_CLIENT_SIGNING_SECRET,PRIVY_APP_ID,PRIVY_APP_SECRET,OLIO_WALLET_DEPLOYER_SECRET,OLIO_ACCOUNT_WASM_HASH,BRIDGE_SPONSOR_SECRET
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SSH_USER }}/olio
            umask 077
            test -n "${MONGODB_URI}"
            test -n "${CRON_SECRET}"
            test -n "${SEP10_CLIENT_SIGNING_SECRET}"
            test -n "${PRIVY_APP_ID}"
            test -n "${PRIVY_APP_SECRET}"
            test -n "${OLIO_WALLET_DEPLOYER_SECRET}"
            test -n "${OLIO_ACCOUNT_WASM_HASH}"
            test -n "${BRIDGE_SPONSOR_SECRET}"
            secret_env="$(mktemp)"
            grep -Ev '^(MONGODB_URI|CRON_SECRET|SEP10_CLIENT_SIGNING_SECRET|PRIVY_APP_ID|PRIVY_APP_SECRET|OLIO_WALLET_DEPLOYER_SECRET|OLIO_ACCOUNT_WASM_HASH|BRIDGE_SPONSOR_SECRET)=' .env.production > "${secret_env}" || true
            {
              printf '%s\n' "MONGODB_URI=${MONGODB_URI}"
              printf '%s\n' "CRON_SECRET=${CRON_SECRET}"
              printf '%s\n' "SEP10_CLIENT_SIGNING_SECRET=${SEP10_CLIENT_SIGNING_SECRET}"
              printf '%s\n' "PRIVY_APP_ID=${PRIVY_APP_ID}"
              printf '%s\n' "PRIVY_APP_SECRET=${PRIVY_APP_SECRET}"
              printf '%s\n' "OLIO_WALLET_DEPLOYER_SECRET=${OLIO_WALLET_DEPLOYER_SECRET}"
              printf '%s\n' "OLIO_ACCOUNT_WASM_HASH=${OLIO_ACCOUNT_WASM_HASH}"
              printf '%s\n' "BRIDGE_SPONSOR_SECRET=${BRIDGE_SPONSOR_SECRET}"
            } >> "${secret_env}"
            mv "${secret_env}" .env.production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export OLIO_IMAGE="${{ needs.build-and-push.outputs.image }}"
            grep -q '^OLIO_IMAGE=' .env && sed -i "s#^OLIO_IMAGE=.*#OLIO_IMAGE=${OLIO_IMAGE}#" .env || echo "OLIO_IMAGE=${OLIO_IMAGE}" >> .env
            docker compose pull web pool-indexer migrate
            if ! docker compose up -d; then
              docker compose logs --no-color migrate || true
              exit 1
            fi
            docker compose logs --no-color migrate
            docker image prune -f
